
name: Build VST3

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Clean build
        run: Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue

      - name: Download JUCE
        run: git clone --depth 1 --branch 8.0.10 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        run: cmake -B build -G "Visual Studio 18 2026" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: MixBalancePro.vst3
          path: build/MixBalancePro_artefacts/Release/VST3/MixBalancePro.vst3
